spring.application.name=eventtix-backend

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/eventtix?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/eventtix_mongo

# Server Port
server.port=8080